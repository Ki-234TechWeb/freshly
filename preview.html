    @media screen and (min-width:768px) {
        .greendiv{

}





.foodimg{

overflow: hidden;
padding: 8px ;

align-self: normal;



}

.foodimg img {
width: 100%;
border-radius: 0;
height: 80;

}


.detail{
margin-top: 70px;
margin-bottom: 14px;


}

.fname h2{
font-size: 1.8rem;
color:#252525;

}

.fname span{
   text-transform: capitalize;
   color:#252525;
   font-size: 1.8rem;
font-weight: bold;


   }

   .additem{
display: flex;
background-color: #ffffff;
align-items: center;
justify-content: center;
padding:0 15px;
gap:10px;
color: #2b8013;
font-size: 1rem;
font-weight: bold;
border-radius: 8px;
height: 45px;

}

.additem button{
padding:0px 10px;
background-color: transparent;
color:#2b8013;
font-size: 1rem;
font-weight: bold;
border: none;

   }




.about-food p{
       text-transform: capitalize;
padding: 10px 0;
       line-height: 1.5;
       font-size: 1.08rem;
       letter-spacing: 2px;
           }

           .about-food{

margin: 10px auto;

}

.about-food h2{
text-transform: capitalize;
font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;

   }

   .addcart {
font-size: 1.2rem;
margin-top: 20px;



   }

   .addcart span svg{
width: 25px;

}


   .return span:nth-child(2){
           background-color:transparent;
          color:#ffffff ;
           font-size: 2.8rem;
          

           }


           .whitediv{
               
display: grid;
align-items: first baseline;
margin: 0 auto;
grid-template-columns: repeat(2,50%);
justify-content: center;
align-items: center;
position: absolute;
top: 10%;
border-radius: 20px;
background-color: transparent;
}


.prep {
   width: 90%;
   display: flex;
   align-items: center;
   justify-content: left  ;
   gap: 20px;
margin: 0 auto;

}

.waves svg{
   width: 100% !important;
   position: absolute;
   top: -35%;
}




   }


   @media screen and (min-width: 996px) {
      
    .foodimg{
position: relative;
width: 400px;

overflow: hidden;
padding: 8px ;
background: #fff;

}

               }
